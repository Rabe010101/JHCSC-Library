<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registered Users</title>
  <link rel="stylesheet" href="Registered.css">
</head>
<body>
  <nav>
    <div class="logo-title">
      <img src="images/School_logo.png" alt="logo" class="logo">
      <span class="site-title">JHCSC</span>
    </div>
    <ul>
      <li><a href="Dashboard.php">Dashboard</a></li>
      <li><a href="Account.html">Account</a></li>
    </ul>
  </nav>

  <h1 class="registered-users">Registered Users</h1>
  
  <div class="search-filter">
    <input type="text" id="searchBox" placeholder="Search by name or email..." class="search-box">
    <select id="yearFilter" class="year-dropdown">
      <option value="">All Year Levels</option>
      <option value="1st Year">1st Year</option>
      <option value="2nd Year">2nd Year</option>
      <option value="3rd Year">3rd Year</option>
      <option value="4th Year">4th Year</option>
    </select>
    <select id="courseFilter" class="course-dropdown">
      <option value="">All Courses</option>
      <option value="BSN">BSN</option>
      <option value="BSIT">BSIT</option>
      <option value="BSEd">BSEd</option>
      <option value="BSHM">BSHM</option>
      <option value="BSE">BSE</option>
      <option value="BSTM">BSTM</option>
      <option value="JD">JD</option>
    </select>
  </div>

  <div class="table-container" style="position: relative; padding-bottom: 60px;">
    <table>
      <thead>
        <tr>
          <th>Registered ID</th>
          <th>Full Name</th>
          <th>Course</th>
          <th>Year Level</th>
          <th>Email</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="usersTableBody">
        </tbody>
    </table>

    <div id="pagination-controls" style="position: absolute; bottom: 15px; right: 20px; display: flex; align-items: center; gap: 10px;">
        <span id="page-info" style="font-size: 14px; color: #555;"></span>
        <button id="prev-btn" class="btn-email" style="background: #ccc; cursor: not-allowed;" disabled>Previous</button>
        <button id="next-btn" class="btn-email">Next</button>
    </div>
  </div>

  <div id="emailModal" class="modal" style="display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5);">
    <div class="modal-content" style="background-color: #fff; margin: 10% auto; padding: 20px; border-radius: 5px; width: 500px; position: relative;">
      <span class="close" id="closeEmailModal" style="position: absolute; right: 15px; top: 10px; font-size: 24px; cursor: pointer;">&times;</span>
      
      <h2 style="color: #046421; margin-bottom: 15px;">Compose Email</h2>
      
      <form id="emailForm">
        <input type="hidden" id="emailRecipient">
        
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">To:</label>
        <input type="text" id="emailDisplay" disabled style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; background: #f9f9f9;">
        
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Subject:</label>
        <input type="text" id="emailSubject" required style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc;">
        
        <label style="font-weight: bold; display: block; margin-bottom: 5px;">Message:</label>
        <textarea id="emailMessage" required rows="6" style="width: 100%; padding: 8px; border: 1px solid #ccc; resize: vertical;"></textarea>
        
        <button type="submit" class="btn-email" style="width: 100%; margin-top: 15px; padding: 10px; font-size: 16px; cursor: pointer;">Send Email</button>
      </form>
    </div>
  </div>

  <script src="Registered.js"></script>
</body>
</html>
